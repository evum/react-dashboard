services:
    server:
        init: true
        build:
            context: .
            dockerfile: Dockerfile.server
        env_file: .env
        environment:
            HOST: 0.0.0.0
            PORT: '3000'
        ports:
            - '${SERVER_PORT:-3000}:3000'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s

    client:
        build:
            context: .
            dockerfile: Dockerfile.client
        ports:
            - '${CLIENT_PORT:-8080}:80'
        depends_on:
            server:
                condition: service_healthy
